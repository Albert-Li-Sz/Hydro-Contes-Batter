<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>{{ title }}</title>
<link rel="stylesheet" href="{{ codeBase }}/hydro-capture.css">
</head>
<body class="capture-device">
<main>
  <header>
    <div><h1 id="device-name"></h1><p id="device-seat"></p></div>
    <p id="device-contest"></p>
  </header>
  <p id="recording" class="capture-recording" role="alert" hidden><strong>● 正在录制屏幕和摄像头</strong>请保持本窗口打开（可以最小化）。关闭本窗口或退出浏览器会中断录制，比赛工作人员会看到中断。</p>
  <p id="status" role="status" aria-live="polite"></p>
  <section class="capture-tiles">
    <figure id="screen-tile"><video id="screen-video" muted autoplay playsinline></video><figcaption>屏幕 · <span id="screen-state"></span></figcaption></figure>
    <figure id="webcam-tile"><video id="webcam-video" muted autoplay playsinline></video><figcaption>摄像头 · <span id="webcam-state"></span></figcaption></figure>
  </section>
  <div class="capture-actions"><button type="button" id="start">开始采集</button><span id="watching"></span></div>
  <p class="capture-note">屏幕和摄像头用于本场比赛的直播和赛事记录，由 Hydro 统一管理，只在比赛工作人员或直播需要时才会传出。开始共享时请在浏览器弹出的窗口中选择“整个屏幕”。</p>
</main>
<script type="application/json" id="capture-runtime">{{ runtimeJson | safe }}</script>
<script type="module" src="{{ codeBase }}/js/hydro-live-capture-device.js"></script>
</body>
</html>
